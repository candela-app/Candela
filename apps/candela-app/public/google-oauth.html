<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kandela</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f4f7fc; }
      .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; }
      .spin {
        width: 32px; height: 32px; border-radius: 9999px;
        border: 2px solid #cbd5e1; border-top-color: #1e293b;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap"><div class="spin"></div></div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var hash = window.location.hash.replace(/^#/, '');
        if (hash) {
          new URLSearchParams(hash).forEach(function (value, key) {
            params.set(key, value);
          });
        }
        var idToken = params.get('id_token');
        var returnTo = params.get('state') || '';
        var ok = /^(exp:\/\/|candela:\/\/)/i.test(returnTo);
        if (!idToken || !ok) {
          return;
        }
        var join = returnTo.indexOf('?') >= 0 ? '&' : '?';
        window.location.replace(returnTo + join + 'id_token=' + encodeURIComponent(idToken));
      })();
    </script>
  </body>
</html>
