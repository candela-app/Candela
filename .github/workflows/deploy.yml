name: Production Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_eas:
        description: 'Run EAS Android APK even if mobile/shared files did not change'
        type: boolean
        default: true

concurrency:
  group: ci-cd-main
  cancel-in-progress: true

env:
  SLACK_WEBHOOK_URL_WEB: ${{ secrets.SLACK_WEBHOOK_URL_WEB }}
  SLACK_WEBHOOK_URL_MOBILE: ${{ secrets.SLACK_WEBHOOK_URL_MOBILE }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # workflow_dispatch has no commit range; skip the filter and let force_eas decide.
          base: ${{ github.event_name == 'push' && github.event.before || github.sha }}
          ref: ${{ github.sha }}
          filters: |
            mobile:
              - 'apps/candela-mobile/**'
              - 'packages/shared/**'

  ci:
    name: CI Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build --workspace=@candela/shared

      - name: Build app
        run: npm run build --workspace=@candela/app

      - name: Build backend
        run: npm run build --workspace=@candela/backend

      - name: Slack — CI failed
        if: failure()
        run: |
          chmod +x .github/scripts/slack-notify.sh
          .github/scripts/slack-notify.sh "$SLACK_WEBHOOK_URL_WEB" \
            ":x: *Candela CI failed* on \`${{ github.ref_name }}\` — commit \`${{ github.sha }}\` by ${{ github.actor }}. Vercel and Render deploys were skipped. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy-vercel:
    name: Deploy Frontend (Vercel)
    needs: ci
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Slack — frontend deploy started
        run: |
          chmod +x .github/scripts/slack-notify.sh
          .github/scripts/slack-notify.sh "$SLACK_WEBHOOK_URL_WEB" \
            ":rocket: *Frontend deploy started* (Vercel) — branch \`${{ github.ref_name }}\`, commit \`${{ github.sha }}\` by ${{ github.actor }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        id: deploy
        run: |
          set -e
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $DEPLOY_URL"

      - name: Slack — frontend deploy succeeded
        if: success()
        run: |
          chmod +x .github/scripts/slack-notify.sh
          .github/scripts/slack-notify.sh "$SLACK_WEBHOOK_URL_WEB" \
            ":white_check_mark: *Frontend deploy succeeded* (Vercel) — ${{ steps.deploy.outputs.url }}"

      - name: Slack — frontend deploy failed
        if: failure()
        run: |
          chmod +x .github/scripts/slack-notify.sh
          .github/scripts/slack-notify.sh "$SLACK_WEBHOOK_URL_WEB" \
            ":x: *Frontend deploy failed* (Vercel) — run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy-render:
    name: Deploy Backend (Render)
    needs: ci
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Slack — backend deploy started
        run: |
          chmod +x .github/scripts/slack-notify.sh
          .github/scripts/slack-notify.sh "$SLACK_WEBHOOK_URL_WEB" \
            ":rocket: *Backend deploy started* (Render) — branch \`${{ github.ref_name }}\`, commit \`${{ github.sha }}\` by ${{ github.actor }}"

      - name: Trigger Render deploy hook
        id: render
        run: |
          set -e
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing secret: RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy hook accepted"

      - name: Slack — backend deploy triggered
        if: success()
        run: |
          chmod +x .github/scripts/slack-notify.sh
          .github/scripts/slack-notify.sh "$SLACK_WEBHOOK_URL_WEB" \
            ":white_check_mark: *Backend deploy triggered* (Render) — hook accepted. Render will finish the rollout on its dashboard (this webhook does not wait for live health)."

      - name: Slack — backend deploy failed
        if: failure()
        run: |
          chmod +x .github/scripts/slack-notify.sh
          .github/scripts/slack-notify.sh "$SLACK_WEBHOOK_URL_WEB" \
            ":x: *Backend deploy failed* (Render hook) — run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  build-mobile-apk:
    name: Build Mobile APK (EAS)
    needs: [changes, ci]
    if: needs.changes.outputs.mobile == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_eas == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN_CANDELA: ${{ secrets.EXPO_TOKEN }}
      EXPO_TOKEN_BACKUP1: ${{ secrets.EXPO_TOKEN_BACKUP1 }}
      EXPO_TOKEN_BACKUP2: ${{ secrets.EXPO_TOKEN_BACKUP2 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Slack — mobile APK build started
        run: |
          chmod +x .github/scripts/slack-notify.sh
          .github/scripts/slack-notify.sh "$SLACK_WEBHOOK_URL_MOBILE" \
            ":rocket: *Mobile APK build started* (EAS Android) — branch \`${{ github.ref_name }}\`, commit \`${{ github.sha }}\` by ${{ github.actor }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@candela/shared

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Require at least one Expo token
        run: |
          if [ -z "$EXPO_TOKEN_CANDELA" ] && [ -z "$EXPO_TOKEN_BACKUP1" ] && [ -z "$EXPO_TOKEN_BACKUP2" ]; then
            echo "Set EXPO_TOKEN (candelaapp) and/or EXPO_TOKEN_BACKUP1 and EXPO_TOKEN_BACKUP2"
            echo "Access tokens are on the Expo TEAM, not Project credentials:"
            echo "https://expo.dev/accounts/candelaapp/settings/access-tokens"
            echo "https://expo.dev/accounts/satvik-27s-team/settings/access-tokens"
            echo "https://expo.dev/accounts/srisais-team/settings/access-tokens"
            exit 1
          fi

      - name: Build Android APK
        id: eas
        working-directory: apps/candela-mobile
        run: |
          chmod +x ../../.github/scripts/eas-android-preview.sh
          ../../.github/scripts/eas-android-preview.sh

      - name: Slack — mobile APK build succeeded
        if: success()
        run: |
          chmod +x .github/scripts/slack-notify.sh
          MSG=":white_check_mark: *Mobile APK build succeeded* (EAS Android via ${{ steps.eas.outputs.eas_account }})
          Build: ${{ steps.eas.outputs.build_page }}
          APK: ${{ steps.eas.outputs.apk_url }}"
          .github/scripts/slack-notify.sh "$SLACK_WEBHOOK_URL_MOBILE" "$MSG"

      - name: Slack — mobile APK build failed
        if: failure() || cancelled()
        run: |
          chmod +x .github/scripts/slack-notify.sh
          .github/scripts/slack-notify.sh "$SLACK_WEBHOOK_URL_MOBILE" \
            ":x: *Mobile APK build failed* (EAS Android) — run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
